<title>Aether Demonlist</title>
<style>
:root{--blue:#5279d8;--text:#20232b;--muted:#737987;--page:#f6f7f9;--border:#e7e9ef;--insane-red:#96323c}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{background:#fff;border-bottom:1px solid var(--border);padding:23px 20px}
.header-inner,main,footer{width:min(920px,calc(100% - 32px));margin:0 auto}
.brand{color:var(--blue);font-size:13px;font-weight:800;letter-spacing:2.4px}
.hero{padding:34px 0 24px}
h1{margin:0 0 8px;font-size:clamp(28px,5vw,38px);letter-spacing:-1.2px}
.subtitle{margin:0;color:var(--muted);font-size:15px}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:6px 0 16px}
h2{font-size:19px;margin:0}.count{color:var(--muted);font-size:13px}
.search-wrap{margin:0 0 18px}
#search{width:100%;border:1px solid var(--border);border-radius:10px;padding:13px 15px;background:#fff;color:var(--text);font-size:14px;outline:none}
#search:focus{border-color:var(--blue)}
.level-list{display:grid;gap:12px}
.level-card{display:grid;grid-template-columns:148px minmax(0,1fr);gap:17px;padding:13px;background:#fff;border:1px solid var(--border);border-radius:13px;min-width:0}
.thumbnail{width:148px;height:94px;object-fit:cover;border-radius:8px;background:#eceef3;display:block}
.level-info{min-width:0;align-self:center}
.level-top{display:flex;align-items:flex-start;gap:10px}
.rank{flex:0 0 auto;display:grid;place-items:center;width:28px;height:28px;border-radius:7px;background:#f0f3fb;color:var(--blue);font-size:12px;font-weight:800}
.level-name{margin:1px 0 5px;font-size:17px;font-weight:750;overflow-wrap:anywhere}
.creator{color:var(--muted);font-size:13px;margin:0 0 10px}
.difficulty{display:inline-block;padding:5px 9px;border-radius:6px;font-size:11px;line-height:1;font-weight:750;letter-spacing:.15px;background:#eee8ff;color:#7650bd}
.difficulty.insane{background:#f0dfe1;color:var(--insane-red)}
.empty{display:none;padding:24px;text-align:center;color:var(--muted);background:#fff;border:1px solid var(--border);border-radius:12px}
footer{padding:28px 0 32px;color:#858b98;font-size:12px;text-align:center}
@media(max-width:520px){.level-card{grid-template-columns:108px minmax(0,1fr);gap:12px;padding:10px}.thumbnail{width:108px;height:84px}.level-name{font-size:15px}.level-top{gap:7px}.rank{width:25px;height:25px}}
</style>
</head>
